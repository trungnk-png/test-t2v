<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tạo video từ mô tả bằng Pika H3 Flex và ComfyUI">
  <title>Text to Video</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Text to Video</h1>
    <div class="system-status"><span id="healthDot" class="status-dot"></span><span id="healthText">Đang kết nối</span></div>
  </header>
  <main>
    <section class="workspace" aria-label="Trình tạo video">
      <form id="generateForm" class="composer">
        <div class="field-head">
          <label for="prompt">Mô tả video</label>
          <span id="charCount">0 / 4000</span>
        </div>
        <textarea id="prompt" maxlength="4000" minlength="3" required placeholder="Nhập mô tả cảnh và chuyển động bạn muốn tạo..."></textarea>
        <div class="controls">
          <button id="generateButton" type="submit">Tạo video</button>
        </div>
        <p id="formError" class="error" role="alert"></p>
      </form>

      <div class="result-panel">
        <div id="emptyState" class="empty-state">
          <h2>Kết quả</h2>
          <p>Video của bạn sẽ xuất hiện tại đây.</p>
        </div>
        <div id="progressState" class="progress-state hidden" aria-live="polite">
          <h2 id="progressMessage">Đang chuẩn bị workflow</h2>
          <div class="progress-track"><span id="progressBar"></span></div>
          <p><strong id="progressValue">0%</strong> · Không đóng cửa sổ này</p>
        </div>
        <div id="videoState" class="video-state hidden">
          <video id="resultVideo" controls playsinline></video>
          <div class="video-meta">
            <div><span>HOÀN TẤT</span><strong id="elapsedTime"></strong></div>
            <a id="downloadLink" download>Tải video ↓</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
